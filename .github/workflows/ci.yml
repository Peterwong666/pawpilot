name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint with ruff
        run: uv run ruff check app web eval tests scripts

      - name: Type check with mypy
        run: uv run mypy app

      - name: Run tests
        run: uv run pytest tests

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t pawpilot:test .

      - name: Verify image has entrypoint artifacts
        run: |
          docker run --rm pawpilot:test uv run python -c "import app.api.main; print('api import ok')"
          docker run --rm pawpilot:test uv run python scripts/ingest.py --help

  docker-smoke:
    # Full-stack smoke test: build image, start db + api + web, call /health.
    # Requires API keys for embedding and (optionally) generation.
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for smoke test
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql://pawpilot:pawpilot@db:5432/pawpilot" >> .env
          echo "SILICONFLOW_API_KEY=${{ secrets.SILICONFLOW_API_KEY }}" >> .env
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY || secrets.SILICONFLOW_API_KEY }}" >> .env

      - name: Start full stack
        run: docker compose -f docker/docker-compose.full.yml up -d --build

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health >/dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          docker compose -f docker/docker-compose.full.yml logs api
          exit 1

      - name: Check database health
        run: curl -fs http://localhost:8000/health/db | grep -q '"status":"ok"'

      - name: Check embedding config
        run: curl -fs http://localhost:8000/health/embed | grep -q '"status":"ok"'

      - name: Teardown
        if: always()
        run: docker compose -f docker/docker-compose.full.yml down -v
